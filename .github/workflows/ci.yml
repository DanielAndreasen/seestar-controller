name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      # Pin ruff: `uv tool run ruff` resolves to the latest release, whose
      # default rule set drifts (0.17 dropped DTZ from defaults, breaking the
      # DTZ001 noqa comments; 0.16 flags SIM102/RUF100 differently).
      - run: uv tool run ruff==0.17.6 check
      - run: uv tool run ty==0.0.109 check

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # uv auto-installs CPython 3.14 per requires-python (>=3.14,<3.15)
      - run: uv sync --locked
      # Headless runner, no gi: gi-gated widget suites skip via
      # pytest.importorskip("gi"). The two deselected tests are the known
      # pre-existing no-gi failures tracked in docs/wiki/dependency-upgrade.md
      # ("Known pre-existing test failures") — they still run locally.
      - run: >
          uv run pytest -q -n auto
          --deselect tests/test_report_sections.py::test_movers_section_omitted_when_no_moving_objects_package
          --deselect tests/test_visibility_planner.py::test_every_visibility_module_is_pure_or_widget_and_the_public_api_is_exported
