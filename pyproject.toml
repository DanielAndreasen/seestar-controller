[project]
name = "seestar-controller"
version = "0.1.0"
description = "Desktop controller for the Seestar S50 smart telescope over the home LAN"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "astropy>=8.0.3",
    "cryptography>=50.0.2",
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "photutils>=3.1.1",
    "pillow>=13.0.0",
]

[project.scripts]
seestar-controller = "seestar_controller.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/seestar_controller"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.ty]
# The sandbox has no PyGObject: the widget-layer modules import `gi` at module
# top (the pure/widget split; the widget tests skip via pytest.importorskip).
# `gi` is a system package on the desktop target, so these imports are
# unresolvable here only — silence import-not-found for exactly those files.
[[tool.ty.overrides]]
include = [
    "src/seestar_controller/analysis/lightcurve_view.py",
    "src/seestar_controller/analysis/period_view.py",
    "src/seestar_controller/enhance/enhance_view.py",
    "src/seestar_controller/enhance/viewer.py",
    "src/seestar_controller/observing/observe_view.py",
    "src/seestar_controller/observing/queue_editor.py",
    "src/seestar_controller/observing/session_log_dialog.py",
    "src/seestar_controller/observing/stale_session_dialog.py",
    "src/seestar_controller/photometry/results_view.py",
    "src/seestar_controller/photometry/star_picker.py",
    "src/seestar_controller/photometry/suggestions_panel.py",
    "src/seestar_controller/ui/app.py",
    "src/seestar_controller/ui/connection_panel.py",
    "src/seestar_controller/ui/notification_log.py",
    "src/seestar_controller/ui/settings_dialog.py",
    "src/seestar_controller/ui/toast.py",
    "src/seestar_controller/ui/views.py",
    "src/seestar_controller/visibility/timeline_view.py",
    "tests/test_analysis_widgets.py",
    "tests/test_enhance_widgets.py",
    "tests/test_observing_widgets.py",
    "tests/test_photometry_widgets.py",
    "tests/test_ui_widgets.py",
    "tests/test_visibility_widgets.py",
]
[tool.ty.overrides.rules]
import-not-found = "ignore"
