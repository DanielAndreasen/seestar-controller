[project]
name = "seestar-controller"
version = "0.1.0"
description = "Desktop controller for the Seestar S50 smart telescope over the home LAN"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "astropy>=8.0.3",
    "cryptography>=50.0.2",
    "numpy>=2.5.5",
    "pillow>=13.0.0",
]

[project.scripts]
seestar-controller = "seestar_controller.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/seestar_controller"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
